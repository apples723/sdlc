name: Build and deploy

on:
  workflow_call:
    inputs:
      compose-dir:
        description: Directory on the deploy runner containing docker-compose.yml
        type: string
        required: true
      runs-on:
        description: Runner label used for the deploy job
        type: string
        required: false
        default: self-hosted

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::build-deploy.yml must be called from a pull_request event" && exit 1
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Fork pull requests get a read-only GITHUB_TOKEN, so they build but do not push.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.image }}

  deploy:
    needs: build
    # Blocks fork pull requests from deploying to the self-hosted runner.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ inputs.runs-on }}
    # Every pull request deploys to the same compose directory, so serialize on it.
    concurrency:
      group: deploy-${{ inputs.runs-on }}-${{ inputs.compose-dir }}
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker compose pull
          docker compose down
          docker compose up -d
        working-directory: ${{ inputs.compose-dir }}
        env:
          IMAGE: ${{ needs.build.outputs.image }}
